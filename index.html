</style></head><body>
<header>
  <div class="top"><h1>Mi bus</h1><div class="clock" id="clock"></div></div>
  <div class="trip">
    <button class="cur" id="tripbtn" aria-haspopup="dialog"><span><b id="tripname">Casa → Trabajo</b><small id="triphint">Tu último trayecto</small></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="swap" id="swap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg><span id="swaplbl">Volver</span></button>
  </div>
  <div class="status"><span id="upd">Cargando…</span><button id="refresh">Actualizar</button></div>
</header>
<main id="list"></main>
<div class="tools">
  <section class="card" id="plan">
    <h2>¿Qué bus cojo?</h2>
    <div class="pf">
      <label for="pt" id="pl">Llegar a las</label>
      <input id="pt" type="time" value="10:00">
      <select id="pd" aria-label="Día"><option value="0">Hoy</option><option value="1">Mañana</option><option value="2">Pasado</option></select>
      <button id="pb">Calcular</button>
    </div>
    <div id="pr"></div>
    <p class="sub">Horario programado de iTranvías; puede variar con el tráfico.</p>
  </section>
  <div class="add">
    <input id="q" type="search" placeholder="Añadir parada: busca por calle (p. ej. Nelle)" autocomplete="off">
    <div class="res" id="res"></div>
    <button class="tg" id="reset">Volver a calcular las paradas de este trayecto</button>
  </div>
  <button id="editbtn">Editar paradas</button>
</div>
<div class="sheet" id="sheet" hidden>
  <button class="scrim" id="scrim" aria-label="Cerrar"></button>

      <button class="act" id="edittrip">Editar paradas de este trayecto</button>
      <button class="act danger" id="deltrip">Borrar este trayecto</button>
    </div>
  </div>
</div>
<div class="wiz" id="wiz" hidden role="dialog" aria-modal="true" aria-labelledby="wt">
  <header>
    <div class="top"><button class="wnav" id="wback">‹ Atrás</button><span class="wstep" id="wstep">Paso 1 de 3</span></div>
    <div class="prog" id="wprog"><i></i><i></i><i></i></div>
  </header>
  <div class="wb" id="wb"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<footer>Tiempos en vivo de iTranvías (Compañía de Tranvías de A Coruña). Se actualiza cada 30 s.</footer>
<script>
{

// iTranvías no permite consultas directas desde el navegador (CORS), así que se usa un intermediario.
// Si despliegas tu propio Worker de Cloudflare (cloudflare/worker.js), pon aquí su URL y se usará primero:
const PROXY = "https://mibus.ygmessiah.workers.dev";
const API = "https://itranvias.com/queryitr_v3.php";
const ROUTES = [
  { k: "allorigins", f: (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
  { k: "codetabs", f: (u) => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u) },
  { k: "corsproxy", f: (u) => "https://corsproxy.io/?url=" + encodeURIComponent(u) },
  { k: "direct", f: (u) => u }
];
let best = null;
try { best = localStorage.getItem("mibus-route"); } catch (e) {}
async function tryFetch(url, ms) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return JSON.parse(await r.text()); }
  finally { clearTimeout(t); }
}
async function getJSON(direct, viaProxy) {
  if (PROXY && viaProxy) { try { return await tryFetch(PROXY.replace(/\/$/, "") + viaProxy, 6000); } catch (e) {} }
  const known = ROUTES.find((r) => r.k === best);
  if (known) { try { return await tryFetch(known.f(direct), 5000); } catch (e) {} }
  const others = ROUTES.filter((r) => r !== known);
  return Promise.any(others.map((r) => tryFetch(r.f(direct), 8000).then((j) => {
    if (best !== r.k) { best = r.k; try { localStorage.setItem("mibus-route", best); } catch (e) {} }
    return j;
  }))).catch(() => { throw new Error("sin conexión"); });
}
async function getStop(id) {
  const direct = API + "?dato=" + id + "&func=0";
  let j = await getJSON(direct, "/api/stop?id=" + id);
  // Si el Worker solo tiene el horario programado, probar en vivo por los proxies públicos
  // (salen con otra IP y no gastan el cupo del Worker).
  if (j && j.programado) { try { const live = await getJSON(direct, null); if (live && live.buses) j = live; } catch (e) {} }
  return Promise.resolve(j).then((j) => {
    if (j.error) throw new Error(j.error);
    // El Worker devuelve "at" (cuándo se consultó iTranvías; puede venir de caché).
    // Los tiempos son relativos a ese momento, no a ahora.
    const at = j.at && j.at <= Date.now() ? j.at : Date.now();
    return { at: at, lineas: j.buses ? (j.buses.lineas || []) : (j.lineas || []), prog: !!j.programado, stale: !!j.stale };
  });
}
function getMeta() {
  try { const c = JSON.parse(localStorage.getItem("mibus-meta2")); if (c && Date.now() - c.t < 864e5) return Promise.resolve(c.m); } catch (e) {}
  return getJSON(API + "?dato=20160101T000000_gl_0_20160101T000000&func=7", "/api/meta").then((j) => {

$('sheet').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
$('triplist').onclick = (e) => { const b = e.target.closest('[data-trip]'); if (!b) return; $('sheet').hidden = true; setTrip(b.dataset.trip, b.dataset.dir); };
$('edittrip').onclick = () => {
  $('sheet').hidden = true;
  if (!document.body.classList.contains('editing')) $('editbtn').click();
  $('list').scrollIntoView({ behavior: 'smooth' });
};
$('deltrip').onclick = () => {
  if (!store.trips.length) return;
  if (!delArmed) { delArmed = true; $('deltrip').textContent = 'Toca otra vez para borrar ' + names(cfg, 'ida').from + ' → ' + names(cfg, 'ida').to; return; }
  store.trips = store.trips.filter((t) => t !== cfg);
  $('sheet').hidden = true;
  if (store.trips.length) { setTrip(store.trips[0].id, 'ida'); return; }
  cfg = EMPTY; tab = 'ida'; save(); render(); openWizard({});
};
$('refresh').onclick = refresh;
$('editbtn').onclick = () => { const on = document.body.classList.toggle('editing'); $('editbtn').textContent = on ? 'Listo' : 'Editar paradas'; render(); };
$('reset').onclick = () => openWizard({ trip: cfg });
$('newtrip').onclick = () => { $('sheet').hidden = true; openWizard({}); };
$('list').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.a === 'wizard') { openWizard({}); return; }
  if (b.dataset.f != null) { filt = b.dataset.f ? Number(b.dataset.f) : null; manualFilt = true; render(); return; }
  if (b.dataset.rm != null) { cfg[tab].splice(Number(b.dataset.rm), 1); save(); render(); return; }
  if (b.dataset.l) {
    const s = cfg[tab][Number(b.dataset.i)], lid = Number(b.dataset.l);
    const d = data[s.id];
    let set = s.lines ? s.lines.slice() : ((d && d.lineas) || []).map((l) => l.linea);
    set = set.indexOf(lid) >= 0 ? set.filter((x) => x !== lid) : set.concat(lid);
    s.lines = set.length ? set : null;
    save(); render();
  }
};
$('q').oninput = () => {
  const q = norm($('q').value.trim());
  if (q.length < 2) { $('res').innerHTML = ''; return; }
  const hits = Object.keys(meta.stops).filter((id) => norm(meta.stops[id]).indexOf(q) >= 0 || id === q).slice(0, 8);
  $('res').innerHTML = hits.map((id) => '<button data-add="' + esc(id) + '">' + esc(meta.stops[id]) + ' <small>· parada ' + esc(id) + '</small></button>').join('') ||
    '<p class="sub">Sin resultados.</p>';
};
$('res').onclick = (e) => {
  const b = e.target.closest('button[data-add]'); if (!b) return;
  cfg[tab].push({ id: Number(b.dataset.add), lines: null }); save();
  $('q').value = ''; $('res').innerHTML = ''; render(); refresh();
};
function planLabel() { $('pl').textContent = tab === 'ida' ? 'Llegar a las' : 'Salgo a las'; try { const v = localStorage.getItem('mibus-plan-' + tab); $('pt').value = v || (tab === 'ida' ? '10:00' : '22:00'); } catch (e) {} $('pr').innerHTML = ''; }
async function runPlan() {
  if (!PROXY) { $('pr').innerHTML = '<div class="err">Hace falta el Worker para el horario.</div>'; return; }
  const v = $('pt').value; if (!v) return;
  try { localStorage.setItem('mibus-plan-' + tab, v); } catch (e) {}
  const d = new Date(); d.setDate(d.getDate() + Number($('pd').value));
  const date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  $('pr').innerHTML = '<div class="empty">Calculando…</div>';
  try {
    const p = await tryFetch(PROXY.replace(/\/$/, '') + '/api/plan?trip=' + tab + '&time=' + encodeURIComponent(v) + '&date=' + date, 8000);
    const opts = (p.options || []).slice(0, 4);
    if (!opts.length) { $('pr').innerHTML = '<div class="empty">No hay buses para esa hora.</div>'; return; }
    $('pr').innerHTML = (p.tipo ? '<div class="sub">' + esc(p.tipo) + '</div>' : '') + opts.map((o) => {
      const li = lineInfo(o.lineId);
      return '<div class="row pr"><div class="chip" style="background:' + li.c + '">' + esc(li.n) + '</div><div class="mid"><div class="min">' + esc(o.bus) + (o.main ? '<span class="fav">★</span>' : '') + '</div>' +
        '<div class="stp">' + esc(o.stop) + '</div></div><div class="at"><b>' + esc(o.arrive) + '</b><span>' + 'llegas' + '</span></div></div>';
    }).join('');
  } catch (e) { $('pr').innerHTML = '<div class="err">No se pudo consultar el horario. Prueba otra vez.</div>'; }
}
$('pb').onclick = runPlan;

// ---------- «Configura tu trayecto»: origen → destino → paradas ----------
// planner.js, buscador.js y los recorridos se cargan solo al abrir el asistente.
const PAGES = /github\.io$|^localhost$|^127\./.test(location.hostname) || location.protocol === 'file:' ? '' : 'https://yomergonzalez.github.io/Mibus/';
let libs = null, W = null, wTimer = 0;
function loadScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
function ensureLibs() {
  if (!libs) libs = Promise.all([
    window.MiBusPlanner ? 0 : loadScript(PAGES + 'planner.js'),
    window.MiBusBuscador ? 0 : loadScript(PAGES + 'buscador.js'),
    fetch(PAGES + 'gtfs/meta.json').then((r) => r.json()),
    fetch(PAGES + 'gtfs/routes.json').then((r) => r.json()),
  ]).then((x) => ({ P: window.MiBusPlanner.crear({ meta: x[2], routes: x[3] }), B: window.MiBusBuscador, meta: x[2] }))
    .catch((e) => { libs = null; throw e; });
  return libs;
}
const ICON_PIN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const TIPO = { popular: 'Sitio', sitio: 'Sitio', direccion: 'Dirección', calle: 'Calle', parada: 'Parada' };
const chipsOf = (ids) => '<span class="lc">' + ids.map((l) => { const m = W && W.lib && W.lib.meta.lines[l]; const li = m ? { n: m.n, c: /^#[0-9a-f]{3,8}$/i.test(m.c || '') ? m.c : lineInfo(Number(l)).c } : lineInfo(Number(l)); return '<span class="chip" style="background:' + li.c + '">' + esc(li.n) + '</span>'; }).join('') + '</span>';

function openWizard(o) {
  W = { step: 1, mode: 'loc', origen: null, destino: null, q: '', res: [], locating: false, err: '', opts: null, ida: null, vta: null, nombre: '', trip: o.trip || null, lib: null };
  if (W.trip) {
    W.origen = { nombre: W.trip.origen.nombre, pos: endPos(W.trip, 'origen') };
    W.destino = { nombre: W.trip.destino.nombre, pos: endPos(W.trip, 'destino') };
    W.nombre = W.trip.destino.nombre; W.step = 3;
  }
  $('wiz').hidden = false; document.body.style.overflow = 'hidden';
  wRender();
  ensureLibs().then((l) => { if (!W) return; W.lib = l; if (W.step === 3) wCompute(); wRender(); })
    .catch(() => { if (W) { W.err = 'No se pudieron cargar las paradas. Comprueba la conexión y vuelve a intentarlo.'; wRender(); } });
  if (!W.trip) wLocate();
}
function closeWizard() { W = null; $('wiz').hidden = true; document.body.style.overflow = ''; }
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 4000); }

function wLocate() {
  W.mode = 'loc'; W.err = '';
  if (!navigator.geolocation) { W.mode = 'type'; W.err = 'Tu navegador no da la ubicación. Escribe tu calle o tu parada.'; wRender(); return; }
  W.locating = true; wRender();
  navigator.geolocation.getCurrentPosition((p) => {
    if (!W) return;
    W.locating = false; W.origen = { nombre: 'Casa', pos: [p.coords.latitude, p.coords.longitude], aqui: true }; wRender();
  }, () => {
    if (!W) return;
    W.locating = false; W.mode = 'type'; W.err = 'No pudimos ver tu ubicación. Escribe tu calle o tu parada.'; wRender();
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

// Paradas para cada sentido: una tarjeta por parada con todas las líneas que te llevan.
// Se marcan solas las más rápidas (hasta 5 min peor que la mejor) que aporten alguna línea nueva.
function stopGroups(list, prev) {
  const g = W.lib.P.porParadaDeSubida(list).map((x) => {
    const best = x.opciones.reduce((a, o) => (o.total < a.total ? o : a));
    return { id: x.parada.id, nombre: x.parada.nombre, lineas: x.opciones.map((o) => o.linea), best };
  }).sort((a, b) => a.best.total - b.best.total);
  const out = g.filter((x) => x.best.total <= (g[0] ? g[0].best.total : 0) + 10).slice(0, 6);
  const sel = new Set();
  if (prev && prev.length) { for (const x of out) if (prev.some((s) => String(s.id) === x.id)) sel.add(x.id); }
  if (!sel.size && out.length) {
    const seen = new Set(), top = out[0].best.total;
    for (const x of out) {
      if (sel.size >= 4 || x.best.total > top + 5) break;
      if (x.lineas.some((l) => !seen.has(l))) { sel.add(x.id); x.lineas.forEach((l) => seen.add(l)); }
    }
  }
  return { list: out, sel };
}
function wCompute() {
  const P = W.lib.P, r = { radioOrigenM: 600, radioDestinoM: 400 };
  W.ida = stopGroups(P.opcionesDirectas(W.origen.pos, W.destino.pos, r), W.trip && W.trip.ida);
  W.vta = stopGroups(P.opcionesDirectas(W.destino.pos, W.origen.pos, r), W.trip && W.trip.vuelta);
  W.opts = W.ida.list;
}
function chosenStops(d) { return d.list.filter((x) => d.sel.has(x.id)).map((x) => ({ id: Number(x.id), lines: x.lineas.map(Number) })); }
function wSave() {
  const ida = chosenStops(W.ida);
  if (!ida.length) return;
  const nombre = (W.nombre || W.destino.nombre || '').trim().slice(0, 40) || 'Destino';
  const d = { origen: { nombre: (W.origen.nombre || 'Casa'), pos: W.origen.pos }, destino: { nombre, pos: W.destino.pos }, ida, vuelta: chosenStops(W.vta) };
  let t = W.trip;
  if (t) Object.assign(t, d); else { t = Object.assign({ id: 't' + Date.now().toString(36) }, d); store.trips.push(t); }
  closeWizard();
  if (document.body.classList.contains('editing')) $('editbtn').click();
  setTrip(t.id, 'ida');
  toast(d.vuelta.length ? 'Trayecto guardado, con la ida y la vuelta.' : 'Trayecto guardado. No hay bus directo de vuelta.');
}

function wSearchHTML(forOrigen) {
  return '<div><h2 id="wt">' + (forOrigen ? '¿Desde dónde sales?' : '¿A dónde vas?') + '</h2><p class="lead">' +
    (forOrigen ? 'Escribe tu calle con número, o tu parada.' : 'Una calle, un número o un sitio. No hace falta saber la parada.') + '</p></div>' +
    (W.err && forOrigen ? '<p class="note">' + esc(W.err) + '</p>' : '') +
    '<label class="srch"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>' +
    '<input id="wq" type="search" autocomplete="off" enterkeyhint="search" aria-label="' + (forOrigen ? 'Desde dónde sales' : 'A dónde vas') + '" placeholder="' + (forOrigen ? 'Ej.: Ronda de Nelle 100' : 'Ej.: Ronda de Outeiro 200, Hospital…') + '" value="' + esc(W.q) + '"></label>' +
    '<div id="wres" style="display:grid;gap:16px"></div>' +
    (forOrigen ? '<button class="ghost" data-a="loc">Usar mi ubicación</button>' : '');
}
function wRenderRes() {
  const box = $('wres'); if (!box || !W) return;
  if (!W.lib) { box.innerHTML = '<p class="note">Cargando…</p>'; return; }
  const forOrigen = W.step === 1;
  if (!W.q.trim()) {
    if (forOrigen) { box.innerHTML = ''; return; }
    W.res = W.lib.B.populares('');
    box.innerHTML = '<div class="lab">Sitios populares</div><div class="grid2">' + W.res.map((r, i) => '<button class="pop" data-k="' + i + '"><b>' + esc(r.nombre) + '</b><small>' + esc(r.detalle) + '</small></button>').join('') + '</div>' +
      '<p class="note">¿No sabes la dirección? Vuelve cuando estés allí y busca por el nombre de la calle.</p>';
    return;
  }
  box.innerHTML = W.res.length ? '<div class="lst">' + W.res.map((r, i) => '<button data-k="' + i + '"><span><b>' + esc(r.nombre) + '</b><small>' + esc(TIPO[r.tipo] || '') + (r.detalle ? ' · ' + esc(r.detalle) : '') + '</small></span></button>').join('') + '</div>' +
    (W.searching ? '<p class="note">Buscando más…</p>' : '') :
    '<p class="note">' + (W.searching ? 'Buscando…' : 'Sin resultados. Prueba con el nombre de la calle o de un sitio conocido.') + '</p>';
}
function wSearch() {
  const q = W.q;
  if (!W.lib) { wRenderRes(); return; }
  W.res = W.lib.B.mezclar(q, [], W.lib.meta);
  W.searching = q.trim().length >= 3;
  wRenderRes();
  clearTimeout(wTimer);
  if (!W.searching) return;
  wTimer = setTimeout(async () => {
    const near = (W.origen && W.origen.pos) || (here && here.p) || null;
    const rem = await W.lib.B.remoto(q, { base: PROXY, cerca: near });
    if (!W || W.q !== q) return;
    W.searching = false;
    W.res = W.lib.B.mezclar(q, rem, W.lib.meta);
    wRenderRes();
  }, 350);
}

function wRender() {
  if (!W) return;
  $('wstep').textContent = 'Paso ' + W.step + ' de 3';
  [...$('wprog').children].forEach((el, i) => el.classList.toggle('on', i < W.step));
  $('wback').textContent = W.step === 1 || (W.trip && W.step === 3) ? '✕ Cerrar' : '‹ Atrás';
  let h = '';
  if (W.step === 1 && W.mode === 'type' && !W.origen) h = wSearchHTML(true);
  else if (W.step === 1) {
    h = '<div><h2 id="wt">¿Desde dónde sales?</h2><p class="lead">Normalmente, tu casa. Usamos tu ubicación solo para esto.</p></div>';
    if (W.locating) h += '<div class="here">' + ICON_PIN + '<span><b>Buscando tu ubicación…</b><small>Si el móvil te pregunta, permite la ubicación.</small></span></div>';
    if (W.origen) {
      const near = W.lib ? W.lib.P.paradasCerca(W.origen.pos, 600, 6) : null;
      h += '<div class="here">' + ICON_PIN + '<span><b>' + esc(W.origen.label || (near && near[0] ? 'Estás cerca de ' + near[0].nombre : 'Tu ubicación')) + '</b><small>' + (W.origen.aqui ? 'Ubicación actual' : 'Punto de salida') + '</small></span><button data-a="type">Cambiar</button></div>';
      h += '<div class="lab">Paradas a menos de 10 min andando</div>';
      if (!near) h += '<p class="note">' + esc(W.err || 'Cargando paradas…') + '</p>';
      else if (!near.length) h += '<p class="note">No hay paradas de bus a menos de 10 minutos de aquí.</p>';
      else h += '<div class="lst">' + near.map((p) => '<div><span><b>' + esc(p.nombre) + '</b><small>' + p.minAndando + ' min andando</small></span>' + chipsOf(p.lineas) + '</div>').join('') + '</div>' +
        '<p class="note">No tienes que elegir ahora: en el paso 3 marcamos solas las que te llevan a tu destino.</p>';
      h += '<button class="bigbtn" data-a="next"' + (near && near.length ? '' : ' disabled') + '>Siguiente: ¿a dónde vas?</button>';
    }
    if (!W.origen && !W.locating) h += '<button class="bigbtn" data-a="loc">Usar mi ubicación</button>';
    if (!W.locating) h += '<button class="ghost" data-a="type">Prefiero escribir mi calle</button>';
  } else if (W.step === 2) h = wSearchHTML(false);
  else {
    h = '<div><h2 id="wt">Así llegas a ' + esc(W.destino.nombre) + '</h2><p class="lead">Hemos marcado las paradas más rápidas con bus directo, para ir y para volver. Toca una para quitarla o añadirla.</p></div>';
    if (!W.opts) h += '<p class="note">' + esc(W.err || 'Calculando…') + '</p>';
    else if (!W.opts.length) h += '<div class="wcard"><b>No hay ningún bus directo hasta aquí</b><p class="note">Este viaje necesita transbordo. Lo añadiremos pronto. Mientras, prueba con un destino cercano.</p></div><button class="ghost" data-a="dest">Elegir otro destino</button>';
    else {
      const card = (dir, x) => {
        const on = W[dir].sel.has(x.id), o = x.best;
        return '<button class="opt" data-g="' + dir + '|' + esc(x.id) + '" aria-pressed="' + on + '"><span class="box">' + (on ? ICON_CHECK : '') + '</span><span>' +
          '<span class="h">' + chipsOf(x.lineas) + (x === W[dir].list[0] ? '<span class="best">Más rápido</span>' : '') + '<em>' + o.total + ' min</em></span>' +
          '<b>' + esc(x.nombre) + '</b><small>' + o.minAndandoIni + ' min a pie · ' + o.minBus + ' en bus · bajas en ' + esc(o.baja.nombre) + '</small></span></button>';
      };
      const n = W.ida.sel.size;
      h += '<div class="lab">Para ir · ' + esc(W.origen.nombre || 'Casa') + ' → ' + esc(W.destino.nombre) + '</div><div class="opts">' + W.ida.list.map((x) => card('ida', x)).join('') + '</div>';
      h += '<div class="lab">Para volver · ' + esc(W.destino.nombre) + ' → ' + esc(W.origen.nombre || 'Casa') + '</div>' +
        (W.vta.list.length ? '<div class="opts">' + W.vta.list.map((x) => card('vta', x)).join('') + '</div>' : '<p class="note">No hay bus directo de vuelta; la vuelta quedará vacía.</p>');
      h += '<div class="wcard"><div class="wnm" style="border:0;padding:0"><label for="wname">Llamar a este destino</label><input id="wname" maxlength="40" value="' + esc(W.nombre || W.destino.nombre) + '"></div></div>' +
        '<button class="bigbtn" data-a="save"' + (n ? '' : ' disabled') + '>' + (n ? 'Guardar trayecto' : 'Marca al menos una parada para ir') + '</button>';
    }
  }
  $('wb').innerHTML = h;
  const q = $('wq');
  if (q) { q.oninput = () => { W.q = q.value; wSearch(); }; wSearch(); if (W.step === 2 || W.mode === 'type') q.focus(); }
  const nm = $('wname'); if (nm) nm.oninput = () => { W.nombre = nm.value; };
}
$('wb').onclick = (e) => {
  const b = e.target.closest('button'); if (!b || !W) return;
  const a = b.dataset.a;
  if (a === 'next') { W.step = 2; W.q = ''; wRender(); }
  else if (a === 'type') { W.mode = 'type'; W.origen = null; W.q = ''; W.err = ''; wRender(); }
  else if (a === 'loc') wLocate();
  else if (a === 'dest') { W.step = 2; W.q = ''; W.opts = null; wRender(); }
  else if (a === 'save') wSave();
  else if (b.dataset.k != null) {
    const r = W.res[Number(b.dataset.k)]; if (!r) return;
    if (W.step === 1) { W.origen = { nombre: 'Casa', pos: r.pos, label: r.nombre }; W.mode = 'loc'; W.q = ''; wRender(); }
    else { W.destino = { nombre: r.nombre, pos: r.pos }; W.nombre = r.nombre; W.step = 3; W.opts = null; if (W.lib) wCompute(); wRender(); }
  } else if (b.dataset.g) {
    const [dir, id] = b.dataset.g.split('|'), sel = W[dir].sel;
    if (sel.has(id)) sel.delete(id); else sel.add(id);
    const y = window.scrollY, t = $('wiz').scrollTop;
    wRender();
    $('wiz').scrollTop = t; window.scrollTo(0, y);
    const again = document.querySelector('[data-g="' + dir + '|' + id + '"]'); if (again) again.focus({ preventScroll: true });
  }
};
$('wback').onclick = () => {
  if (!W) return;
  if (W.step === 1 || (W.trip && W.step === 3)) { closeWizard(); return; }
  W.step -= 1; W.q = ''; wRender();
};
$('wiz').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeWizard(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 5 * 60000) { manual = false; manualFilt = false; }
  autoTab();
  refresh();
});

render();
if (!store.trips.length) openWizard({});
autoTab();
refresh().then(() => getMeta().then((m) => { meta = m || meta; render(); }).catch(() => {}));
setInterval(refresh, 30000);
setInterval(autoTab, 45000);
setInterval(() => { tick(); }, 1000);
setInterval(render, 15000);
}
</script>
