name: Actualizar horario (GTFS)

on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths: ["tools/gen_schedule.py", ".github/workflows/schedule.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar schedule.json
        run: python tools/gen_schedule.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar horario programado"
          git pull --rebase
          git push
