name: Generar datos GTFS

on:
  push:
    branches: ["feat/planificador-trayectos"]
    paths: ["tools/gtfs_build.py", ".github/workflows/gtfs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descargar GTFS de Tranvías
        run: |
          for u in \
            "https://nap.transportes.gob.es/api/Fichero/download/1574" \
            "https://files.mobilitydatabase.org/mdb-2767/latest/mdb-2767.zip"; do
            if curl -fsSL --retry 2 -o gtfs.zip "$u" && python -c "import zipfile; zipfile.ZipFile('gtfs.zip').testzip()"; then
              echo "GTFS de $u"; exit 0
            fi
          done
          echo "No se pudo descargar el GTFS"; exit 1

      - name: Generar gtfs/
        run: python tools/gtfs_build.py gtfs.zip

      - name: Tests
        run: |
          python -m unittest discover -s test -p 'test_*.py'
          node --test test/*.test.js

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gtfs
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos GTFS con recorridos (routes.json)"
          git pull --rebase
          git push
