name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths: ["cloudflare/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare

      - name: Point the app at the worker
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Worker URL: $URL"
          if [ -z "$URL" ]; then echo "No deployment URL returned"; exit 0; fi
          sed -i "s#^const PROXY = \".*\";#const PROXY = \"$URL\";#" index.html
          if git diff --quiet; then echo "PROXY already set"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Usar el Worker propio como intermediario"
          git push
